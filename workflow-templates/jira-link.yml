name: Jira link

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  jira-link:
    runs-on: ubuntu-latest
    if: ${{ vars.JIRA_BASE_URL != '' }}
    steps:
      - uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            // Branch name = Jira key, e.g. APPSTATS-12
            const match = branch.match(/^([a-z][a-z0-9]+-\d+)/i);
            if (!match) {
              core.info(`No Jira key in branch "${branch}"`);
              return;
            }
            const key = match[1].toUpperCase();
            const baseUrl = process.env.JIRA_BASE_URL.replace(/\/$/, '');
            const url = `${baseUrl}/browse/${key}`;
            const link = `[${key}](${url})`;
            let body = context.payload.pull_request.body || '';
            if (body.includes(url)) return;
            body = body.includes('<!-- jira-link -->')
              ? body.replace('<!-- jira-link -->', link)
              : `**Jira:** ${link}\n\n${body}`;
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              body,
            });
